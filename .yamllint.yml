---
extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start:
    present: false
  comments-indentation:
    level: warning
  empty-lines:
    max: 2
    max-start: 0
    max-end: 1
  trailing-spaces:
    level: warning
  empty-values:
    forbid-in-block-mappings: true
    forbid-in-flow-mappings: true
  key-duplicates:
    level: error
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  colons:
    max-spaces-before: 0
    max-spaces-after: 1
  commas:
    max-spaces-before: 0
    min-spaces-after: 1