# Render.com Deployment Configuration for StudyMentor AI

services:
  # Backend API Service
  - type: web
    name: studymentor-api
    runtime: python
    repo: https://github.com/YOUR_USERNAME/StudyMentor-AI
    branch: main
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studymentor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # Optional - set manually if using OpenAI
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://YOUR_FRONTEND_DOMAIN.onrender.com", "https://studymentor-ai-frontend.onrender.com"]'
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: studymentor-frontend
    runtime: static
    repo: https://github.com/YOUR_USERNAME/StudyMentor-AI
    branch: main
    rootDir: .
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: API_BASE_URL
        value: https://studymentor-api.onrender.com/api
    autoDeploy: true

databases:
  - name: studymentor-db
    databaseName: studymentor
    user: studymentor
    plan: free
    ipAllowList: []